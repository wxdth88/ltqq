name: Build-Windows-EXE

on:
  workflow_dispatch: {}   # 在 GitHub 网页上手动点「Run workflow」触发
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install requests pywebview pyinstaller

      - name: 打包 exe
        run: pyinstaller -F -w --name ltyh_qqsvip lt_qqsvip_windows.py

      - name: 上传 exe 成品
        uses: actions/upload-artifact@v4
        with:
          name: ltyh-qqsvip-windows
          path: dist/ltyh_qqsvip.exe
          retention-days: 30
